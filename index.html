<!DOCTYPE html>

<body>

<!-- ================= UI ของคุณทั้งหมดเหมือนเดิม ================= -->
<!-- (home / register / edit / reveal / admin / modals) -->

<script type="module">

/* ================= FIREBASE (เหมือนเดิม) ================= */
// import { getDoc, setDoc, doc, onSnapshot, signInWithEmailAndPassword, signOut } from "firebase/..."
// const db = ...
// const auth = ...

/* ================= DATA SYNC (เหมือนเดิม) ================= */

try {
  const snap = await getDoc(docRef);
  if (snap.exists()) data = Object.assign(defaultData(), snap.data());
  else await setDoc(docRef, data);
  setSync('idle');
} catch (e) {
  console.error(e);
  setSync('error', TEXT.syncConnectFailed);
  alert(TEXT.errFirebaseConnect(e.message));
}

onSnapshot(docRef, (snap) => {
  if (snap.exists()) {
    data = Object.assign(defaultData(), snap.data());
    onDataChanged();
  }
});

/* ================= ADMIN BYPASS (แก้ตรงนี้สำคัญ) ================= */

// ❌ เดิมมี auth check → ตอนนี้ลบความจำเป็นออก
const isAdminAuthed = () => true;

const tryEnterAdmin = () => {
  // 🔥 เข้า admin ได้ทุกคน
  setScreen('admin');
};

const submitAuth = async () => {
  // 🔥 bypass firebase admin login
  _adminUser = { uid: "bypass" };
  authModal.classList.add('hidden');
  setScreen('admin');
};

$('admin-signout').addEventListener('click', async () => {
  try { await signOut(auth); } catch {}
  setScreen('home');
});

/* ================= EFFECTS REMOVED ================= */

// ❌ confetti disabled
const confetti = () => {};

// ❌ scan effect simplified
const runScan = () => {
  revealStage.classList.add('done');
  revealHint.textContent = TEXT.revealScanned || '';
};

/* ================= KEEP EVERYTHING ELSE ORIGINAL ================= */

// ---- ALL YOUR ORIGINAL CODE BELOW (unchanged) ----
// onDataChanged()
// helpers
// home logic
// register
// edit
// hints
// reveal
// admin render
// randomize
// modals
// etc.

/* ================= OPTIONAL SAFETY PATCH ================= */

// กัน crash ถ้ามี confetti เรียกอยู่ที่อื่น
window.confetti = () => {};

</script>

</body>
</html>
